[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal Autonomous Agent — the core identity and capability unit of the web4,23 network"
requires-python = ">=3.11"
dependencies = [
    "prometheus_client==0.21.1",
    "cryptography==50.0.0",
    "argostranslate==1.9.6",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.122.3",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
